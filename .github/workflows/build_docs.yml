name: Build documentation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

env:
  PUBLISH_DIR: ./_build/html
  PYVISTA_OFF_SCREEN: false
  PYVISTA_JUPYTER_BACKEND: "html"
  LIBGL_ALWAYS_SOFTWARE: 1
  # pyvista renders the demo scenes through VTK, which needs a GL context. With no X
  # server on the runner VTK fell back to EGL, where `LIBGL_ALWAYS_SOFTWARE` is refused
  # ("Not allowed to force software rendering when API explicitly selects a hardware
  # device"), and every recorded frame came out as unlit black fragments while the build
  # still went green. OSMesa renders in software without an X server or an EGL device.
  VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow
  PIP_NO_BUILD_ISOLATION: 0

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/fenics/dolfinx/lab:nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install graphviz
        run: apt update && apt install -y graphviz-dev

      - name: Install mesa-utils
        run: apt-get update && apt-get install -y mesa-utils


      - name: Install dependencies
        run: |
          python3 -m pip install git+https://github.com/funsim/moola.git
          python3 -m pip install ".[docs]"

      - name: Build docs
        run: jupyter book build .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        # always upload artifact, which can include error messages
        if: always()
        with:
          name: documentation
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 2
          if-no-files-found: error

      - name: Show error reports
        if: failure()
        run: |
          find _build/html/reports -type f -print -exec cat {} \;
