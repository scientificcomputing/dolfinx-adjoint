[build-system] # Require setuptool version due to https://github.com/pypa/setuptools/issues/2938
requires = ["setuptools>=61.0.0", "wheel"]

[project]
name = "dolfinx-adjoint"
version = "0.3.0"
description = "Automatic differentation compatible with DOLFINx"
authors = [{ name = "Jørgen S. Dokken", email = "dokken@simula.no" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
      "fenics-dolfinx>=0.10.0",
      "pyadjoint-ad>=2025.10.0",
      "typing_extensions; python_version < '3.11'",
      "packaging>=24.2",
      # Storage for checkpoint schedules that keep state on disk. Build it against MPI to get
      # one shared checkpoint file; without that each process writes its own.
      "h5py",
]


[project.optional-dependencies]
scifem = ["scifem"]
fenicsx_ii = ["fenicsx_ii"]
test = ["pytest", "dolfinx-adjoint[scifem,fenicsx_ii]"]
dev = ["pdbpp", "ipython", "mypy", "ruff"]
docs = [
      "jupyter-book<2.0",
      "jupytext",
      # "moola@git+https://github.com/funsim/moola.git",
      "pandas",
      "pyvista[all]>0.45",
      "networkx",
      "pygraphviz",
      "dolfinx-adjoint[scifem,fenicsx_ii]",
]
all = ["dolfinx-adjoint[test]", "dolfinx-adjoint[dev]", "dolfinx-adjoint[docs]", "dolfinx-adjoint[scifem]"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
# Folders to exclude
exclude = ["docs/", "build/"]
# Folder to check with mypy
files = ["src", "tests"]

[tool.ruff]
src = ["src", "docs", "tests", "examples"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
      # Pyflakes
      "F",
      # Pycodestyle
      "E",
      "W",
      # isort
      "I001",
]


[tool.ruff.lint.isort]
known-first-party = ["dolfinx_adjoint"]
known-third-party = [
      "basix",
      "dolfinx",
      "ffcx",
      "ufl",
      "gmsh",
      "numpy",
      "pytest",
      "pyadjoint",
]
section-order = [
      "future",
      "standard-library",
      "mpi",
      "third-party",
      "first-party",
      "local-folder",
]

[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py", "petsc4py"]


[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "0.3.0"


[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
